name: HTML JavaScript QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check inline JavaScript syntax
        run: python tests/check_html_scripts.py
      - name: Check external JavaScript syntax
        run: node --check admin-manager.js
